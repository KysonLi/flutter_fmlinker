buildscript {
    // 需 ≥2.2 才能读取 fluwx 5.7.7 引入的 kotlin-stdlib 2.2.x 元数据（1.8 编译器最大只能读 1.9）
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// AGP 8 强制要求每个模块显式声明 namespace，而第三方旧插件（如 fluwx 3.x）未迁移。
// 兜底方案：插件模块应用 android 插件时，从 AndroidManifest.xml 的 package 属性读取并注入 namespace。
// 注意不能使用 afterEvaluate：evaluationDependsOn(':app') 下项目可能已被评估，Gradle 8 会直接报错。
subprojects { proj ->
    proj.plugins.withId("com.android.library") {
        proj.android {
            if (namespace == null || namespace.isEmpty()) {
                def manifestFile = proj.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def manifest = new XmlSlurper().parse(manifestFile)
                    def pkg = manifest.@package.text()
                    if (pkg) {
                        namespace = pkg
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
